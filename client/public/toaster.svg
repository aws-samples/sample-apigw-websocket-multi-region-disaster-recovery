<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Body -->
  <rect x="20" y="40" width="80" height="55" rx="10" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
  <!-- Slots -->
  <rect x="35" y="32" width="20" height="12" rx="3" fill="#555"/>
  <rect x="65" y="32" width="20" height="12" rx="3" fill="#555"/>
  <!-- Toast popping out -->
  <rect x="37" y="18" width="16" height="20" rx="2" fill="#d4a056" stroke="#b8863c" stroke-width="1"/>
  <rect x="67" y="22" width="16" height="16" rx="2" fill="#d4a056" stroke="#b8863c" stroke-width="1"/>
  <!-- Lever -->
  <rect x="90" y="55" width="6" height="18" rx="2" fill="#777"/>
  <!-- Base -->
  <rect x="25" y="95" width="70" height="6" rx="3" fill="#bbb"/>
  <!-- Dial -->
  <circle cx="50" cy="75" r="6" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <line x1="50" y1="75" x2="50" y2="70" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Label -->
  <text x="60" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">Smart Toaster Pro</text>
</svg>
